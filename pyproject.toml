[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superkraken"
version = "0.1.0"
description = "Autonomous AI Day Trading Desk CLI modeled after TradingAgents, powered by Kraken CLI, OpenRouter, Textual and Rich"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "superKraken Team" }
]
dependencies = [
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "openai>=1.40.0",
    "textual>=0.70.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "json-repair>=0.30.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
superkraken = "superkraken.cli:app"
trader = "superkraken.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["superkraken"]
